        <script>
            async function getRandomMove(){
                let id = Math.floor(Math.random() * 913) +1;//math.floor rounds down to nearest int, math.random returns 0-1
                // let fetchResponse = fetch("https://pokeapi.co/api/v2/move/{random_id}");
                // fetchResponse.then((data) => {
                //     return data.json();
                // }).then((data) => {
                //     let damage = data.power;
                //     let accuracy = data.accuracy;
                // });
                let response = await fetch("https://pokeapi.co/api/v2/move/" + id);
                let data = await response.json();
                let damage = data.power;
                let name = data.name;

                return {
                    name: name,
                    damage: damage
                };
            }
        </script>
