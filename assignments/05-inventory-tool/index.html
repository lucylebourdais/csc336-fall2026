<html>
<head>
    <title>Lucy's Yarn Shop</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Lucy's Yarn Shop</h1>

        <div id="addProductDiv">
            <form id="addProductForm"> 
                <div>
                <label for="nameInputField">Product Name:</label>
                <input id="nameInputField" type="text" placeholder="Input product name..." required>
                </div>

                <div>
                <label for="colorInputField">Product Color:</label>
                <input id="colorInputField" type="text" placeholder="Input product color..." required>
                </div>

                <div>
                <label for="priceInputField">Product Price:</label>
                <input id="priceInputField" type="number" min="0" step="0.01" placeholder="Input product price..." required>
                </div>

                <div>
                <label for="descInputField">Product Description:</label>
                <textarea id="descInputField" placeholder="Input product description..." required></textarea>
                </div>

                <div>
                <label for="categoryField">Product Category:</label>
                <select id="categoryField" required>
                    <option value="">Select a category</option>
                    <option value="Wool">Wool</option>
                    <option value="Alpaca">Alpaca</option>
                    <option value="Cotton">Cotton</option>
                    <option value="Llama">Llama</option>
                    <option value="Bamboo">Bamboo</option>
                    <option value="Camel">Camel</option>
                </select>
                </div>

                <div>
                <label for="imageInputField">Product Image URL:</label>
                <input id="imageInputField" type="url" placeholder="Input product image URL ..." required>
                <input class="buttons" type="submit">
                </div>

            </form>
            <div>
                <button class="buttons" id="resetProducts">Reset Store</button>
            </div>
            </div>

    <h3 id="cart"></h3>
    <button id="addToCart">Add selected to cart</button>
    <div id="buttonDiv"></div>
    <div id="filterDiv"></div>
    <div class="card"id="root"></div>
    <script src="script.js"></script>
</body>
</html>
